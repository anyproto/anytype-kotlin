plugins {
    id "com.android.library"
    id "kotlin-android"
}

dependencies {

    implementation project(':domain')

    implementation libs.kotlin
    implementation libs.coroutinesAndroid

    // Gemini Nano via the AICore system service — the model lives on-device,
